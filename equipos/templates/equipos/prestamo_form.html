<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitar Préstamo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f1f5f9; padding: 2rem 1rem; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 10px rgba(15,23,42,.08); }
    label { display: block; font-weight: 600; margin-top: .8rem; }
    input, select, textarea { width: 100%; padding: .6rem; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: .25rem; }
    button { margin-top: 1.2rem; background: #1d4ed8; color: #fff; border: 0; padding: .7rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .errorlist { color: #dc2626; font-size: .85rem; }
    a { display: inline-block; margin-left: .8rem; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Solicitar Equipo de Laboratorio</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit">Registrar préstamo</button>
      <a href="/">Volver</a>
    </form>
  </div>
</body>
</html>
