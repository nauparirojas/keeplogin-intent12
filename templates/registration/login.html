<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Sistema UNCP</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #0f172a; }
    .card { width: 100%; max-width: 400px; background: #fff; padding: 2rem; border-radius: 14px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    h1 { margin: 0 0 .25rem; font-size: 1.4rem; }
    p.sub { margin: 0 0 1.5rem; color: #64748b; font-size: .9rem; }
    label { display: block; font-weight: 600; margin: .75rem 0 .35rem; font-size: .9rem; }
    input { width: 100%; padding: .65rem .8rem; border: 1px solid #cbd5e1; border-radius: 8px; }
    button { width: 100%; margin-top: 1.25rem; padding: .75rem; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font-weight: 600; cursor: pointer; }
    button:hover { background: #1e40af; }
    .errorlist { color: #dc2626; padding-left: 1.1rem; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Portal UNCP</h1>
    <p class="sub">Préstamo de Equipos y Gestión Médica</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Iniciar sesión</button>
    </form>
  </div>
</body>
</html>
